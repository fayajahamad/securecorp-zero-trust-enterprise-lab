
name: securecorp-monitoring

services:

  loki:
    image: grafana/loki:3.7.0
    container_name: zt-loki

    command: -config.file=/etc/loki/local-config.yaml

    ports:
      - "127.0.0.1:3100:3100"

    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki

  grafana:
    image: grafana/grafana:12.4
    container_name: zt-grafana

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - loki
    
    
    env_file:
      - .env.smtp

  
  alloy:
    image: grafana/alloy:v1.21.3
    container_name: zt-alloy

    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/securecorp:ro
      - alloy-data:/var/lib/alloy/data

    depends_on:
      - loki


volumes:
  loki-data:
  grafana-data:
  alloy-data:
